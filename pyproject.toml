[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sql-dashboard"
version = "0.1.0"
description = "SQL-first retail analysis on Online Retail II: DuckDB marts, cohorts, RFM, a Streamlit dashboard and a retention memo"
readme = "README.md"
# Pinned for 3.12 and 3.13. 3.14 is excluded on purpose: the numpy and pandas pins here are
# only tested on 3.12 and 3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "duckdb==2.0.0",
    "matplotlib==3.11.2",
    "pyarrow==26.0.1",
    "requests==2.34.2",
    "python-calamine==0.9.1",
]

[project.optional-dependencies]
serve = ["streamlit==1.67.0"]
dev = ["pytest==9.2.0", "ruff==0.17.5"]
notebooks = ["nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
all = ["retail-sql-dashboard[serve,dev,notebooks]"]

[project.scripts]
retail = "retail.cli:main"

[tool.setuptools]
packages = ["retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real: needs the full Online Retail II build (run `retail run-all` first)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"retail/pipeline.py" = ["E501"]
"retail/results.py" = ["E501", "B905"]
# long prose strings and plotting calls read better unwrapped
"retail/report.py" = ["E501"]
"retail/plots.py" = ["E501", "B905"]
"retail/fixture.py" = ["E501"]
"tests/*.py" = ["E501"]
"app/streamlit_app.py" = ["E501"]
"scripts/*.py" = ["E501"]
"notebooks/*.ipynb" = ["E501", "B905", "B007", "F401", "I001"]
